<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little interactive letter, written for you.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#E5CDF5">
  <title>A Letter for You</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="read-progress" aria-hidden="true"><span></span></div>
  <div class="atmosphere" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="float-heart heart-a">♥</span>
    <span class="float-heart heart-b">♥</span>
    <span class="float-heart heart-c">♥</span>
    <span class="float-heart heart-d">♥</span>
  </div>

  <header class="site-header">
    <div class="container letter-container header-inner">
      <p class="brand">For you</p>
      <button type="button" id="restart-btn" class="text-btn" hidden>Start over</button>
    </div>
  </header>

  <main id="app">
    <div class="container letter-container">
      <section id="screen-welcome" class="screen screen-welcome" aria-labelledby="welcome-heading">
        <div class="envelope-wrap" aria-hidden="true">
          <svg class="envelope-art" viewBox="0 0 360 220">
            <rect x="24" y="46" width="312" height="156" rx="6" fill="#FFFFFF" stroke="#5C4F9D" stroke-width="2"/>
            <path d="M24 46 L180 138 L336 46" fill="#B7C1C7" stroke="#5C4F9D" stroke-width="2" stroke-linejoin="round"/>
            <path d="M24 202 L128 112" fill="none" stroke="#A080E2" stroke-width="1.5"/>
            <path d="M336 202 L232 112" fill="none" stroke="#A080E2" stroke-width="1.5"/>
            <circle cx="180" cy="108" r="26" fill="#382D72"/>
            <path fill="#E5CDF5" d="M180 122c0 0-12-8.2-12-15.2 0-3.6 2.6-6 5.6-6 2 0 3.6.9 6.4 3.2 2.8-2.3 4.4-3.2 6.4-3.2 3 0 5.6 2.4 5.6 6 0 7-12 15.2-12 15.2z"/>
          </svg>
        </div>
        <h1 id="welcome-heading" class="display-heading" tabindex="-1"></h1>
        <hr class="rule">
        <p id="welcome-message" class="lead-copy"></p>
        <p id="welcome-extra" class="lead-copy"></p>
        <button type="button" id="open-btn" class="btn btn-primary btn-love"></button>
        <p id="welcome-warning" class="warning-note"></p>
      </section>

      <section id="screen-riddle" class="screen" hidden aria-labelledby="riddle-heading">
        <p id="progress-label" class="progress-label"></p>
        <div
          id="progressbar"
          class="step-dots"
          role="progressbar"
          aria-valuemin="1"
          aria-valuemax="5"
          aria-valuenow="1"
          aria-labelledby="progress-label"
        ></div>
        <h1 id="riddle-heading" class="riddle-question" tabindex="-1"></h1>
        <form id="riddle-form" novalidate>
          <label id="answer-label" class="field-label" for="answer-input"></label>
          <input
            id="answer-input"
            class="answer-input"
            type="text"
            name="answer"
            autocomplete="off"
            enterkeyhint="done"
            maxlength="80"
            aria-describedby="riddle-heading hint-text feedback"
          >
          <div class="d-grid gap-2 d-sm-flex action-row">
            <button type="submit" id="submit-btn" class="btn btn-primary btn-love"></button>
            <button type="button" id="hint-btn" class="btn btn-outline-primary btn-love" aria-controls="hint-text" aria-expanded="false"></button>
          </div>
        </form>
        <p id="hint-text" class="hint-text" hidden aria-live="polite"></p>
        <p id="feedback" class="feedback" role="status"></p>
        <div class="skip-block">
          <p id="skip-note" class="skip-note"></p>
          <button type="button" id="skip-btn" class="text-btn"></button>
          <div id="skip-confirm" class="skip-confirm" hidden>
            <p id="skip-copy" tabindex="-1"></p>
            <div class="d-grid gap-2 d-sm-flex">
              <button type="button" id="skip-yes" class="btn btn-outline-primary btn-love"></button>
              <button type="button" id="skip-no" class="btn btn-primary btn-love"></button>
            </div>
          </div>
        </div>
      </section>

      <section id="screen-letter" class="screen" hidden aria-labelledby="letter-heading">
        <article class="letter-paper">
          <div class="paper-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path fill="none" stroke="#A080E2" stroke-width="1.5" d="M24 40C24 40 8 29 8 18.5 8 13 12 10 16.4 10c2.6 0 4.6 1.2 7.6 4.2C27 11.2 29 10 31.6 10 36 10 40 13 40 18.5 40 29 24 40 24 40z"/>
            </svg>
          </div>
          <h1 id="letter-heading" class="letter-greeting" tabindex="-1"></h1>
          <div id="letter-body"></div>
          <p id="letter-closing" class="sign-off"></p>
          <p id="letter-signature" class="signature"></p>
        </article>
        <div class="after-letter">
          <button type="button" id="letter-continue" class="btn btn-primary btn-love"></button>
        </div>
      </section>

      <section id="screen-final" class="screen" hidden aria-labelledby="final-heading">
        <div class="note-card">
          <h1 id="final-heading" class="final-heading" tabindex="-1"></h1>
          <p id="final-preface" class="final-lead"></p>
          <p id="final-question" class="final-question"></p>
          <p id="final-note" class="final-note"></p>
          <div class="d-grid gap-2 d-sm-flex choice-row">
            <button type="button" id="accept-btn" class="btn btn-primary btn-love"></button>
            <button type="button" id="delay-btn" class="btn btn-outline-primary btn-love"></button>
          </div>
          <div id="celebration-band" class="celebration-band" aria-hidden="true"></div>
          <div id="final-live" aria-live="polite">
            <p id="choice-feedback" class="feedback"></p>
          </div>
          <div class="after-letter">
            <button type="button" id="to-closing" class="btn btn-primary btn-love" hidden></button>
          </div>
        </div>
      </section>

      <section id="screen-closing" class="screen" hidden aria-labelledby="closing-title">
        <article class="letter-paper">
          <p id="closing-remember" class="letter-paragraph"></p>
          <p id="closing-signoff" class="sign-off"></p>
          <p id="closing-signature" class="signature"></p>
        </article>
        <h2 id="closing-title" class="closing-title" tabindex="-1"></h2>
        <p id="closing-note" class="ending"></p>
        <div class="after-letter">
          <button type="button" id="replay-btn" class="btn btn-primary btn-love"></button>
        </div>
      </section>
    </div>
  </main>

  <noscript>
    <p class="noscript-note">This letter needs JavaScript to open. Enable JavaScript, then refresh the page.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
